---
# Example playbook for deploying a k3s cluster with OpenStack CCM, Cinder CSI, and Flux CD.
#
# This playbook composes the ednz_cloud.k3s collection roles:
#   - k3s          : installs and configures k3s
#   - k3s_ccm      : deploys OpenStack Cloud Controller Manager
#   - k3s_csi      : deploys Cinder CSI driver
#   - k3s_flux     : deploys Flux CD
#   - k3s_labels   : manages node labels
#
# Inventory groups:
#   - k3s_etcd     : etcd cluster members (can be same as k3s_controller for stacked etcd)
#   - k3s_controller: control plane nodes (API server, scheduler, controller-manager)
#   - k3s_worker   : worker nodes
#
# For stacked etcd (default): define k3s_etcd and k3s_controller with the same hosts.
# For external etcd: define k3s_etcd as separate dedicated hosts.

- name: "K3S pre-deployment facts"
  hosts: k3s
  gather_facts: true
  any_errors_fatal: true
  become: false
  tasks:
    - name: "K3S | Ensure server manifests directory exists"
      when: k3s_extra_files | default(false)
      ansible.builtin.file:
        path: "/var/lib/rancher/k3s/server/manifests"
        state: directory
        mode: "0755"
      become: true


- name: Deploy k3s etcd cluster
  hosts: k3s_etcd
  become: true
  serial: 1
  roles:
    - role: ednz_cloud.k3s.k3s
      tags: ['k3s', 'etcd']

- name: Deploy k3s control plane and bootstrap add-ons
  hosts: k3s_controller
  become: true
  serial: 1
  roles:
    - role: ednz_cloud.k3s.k3s
      tags: ['k3s', 'controller']

    - role: ednz_cloud.k3s.k3s_ccm
      tags: ['k3s', 'ccm']
      when: k3s_ccm_enabled | default(false)

    - role: ednz_cloud.k3s.k3s_csi
      tags: ['k3s', 'csi']
      when: k3s_csi_enabled | default(false)

    - role: ednz_cloud.k3s.k3s_flux
      tags: ['k3s', 'flux']
      when: k3s_flux_enabled | default(false)

- name: Deploy k3s worker nodes
  hosts: k3s_worker
  become: true
  roles:
    - role: ednz_cloud.k3s.k3s
      tags: ['k3s', 'worker']

- name: Apply node labels
  hosts: k3s
  become: true
  roles:
    - role: ednz_cloud.k3s.k3s_labels
      tags: ['k3s', 'labels']
      when: k3s_labels_enabled | default(false)

- name: "K3S post-deployment tasks"
  hosts: k3s
  gather_facts: true
  any_errors_fatal: true
  become: true
  tasks:
    - name: "Install required packages"
      ansible.builtin.include_role:
        name: ednz_cloud.utils.manage_apt_packages
      vars:
        manage_apt_packages_list:
          - name: python3-kubernetes
            version: latest
            state: present
          - name: python3-yaml
            version: latest
            state: present

    - name: "Include ednz_cloud.k3s.k3s_labels"
      ansible.builtin.include_role:
        name: ednz_cloud.k3s.k3s_labels
        apply:
          delegate_to: "{{ groups['k3s_controller'][0] }}"

    - name: "Install cron package"
      ansible.builtin.include_role:
        name: ednz_cloud.utils.manage_apt_packages
      vars:
        manage_apt_packages_list:
          - name: cron
            version: latest
            state: present

    - name: "Setup cleanup cron for unused k3s data"
      ansible.builtin.cron:
        name: "Cleanup unused k3s data"
        minute: "0"
        hour: "4"
        job: "/usr/local/bin/k3s crictl rmi --prune"
        user: root
