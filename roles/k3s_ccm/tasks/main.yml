---
# tasks file for k3s_ccm

- name: "K3S CCM | Ensure server manifests directory exists"
  ansible.builtin.file:
    path: "{{ k3s_ccm_data_dir }}/server/manifests"
    state: directory
    mode: "0755"
    owner: "{{ k3s_ccm_user }}"
    group: "{{ k3s_ccm_group }}"

- name: "K3S CCM | Deploy OpenStack CCM manifest"
  ansible.builtin.template:
    src: "openstack-ccm.yaml.j2"
    dest: "{{ k3s_ccm_data_dir }}/server/manifests/openstack-ccm.yaml"
    owner: "{{ k3s_ccm_user }}"
    group: "{{ k3s_ccm_group }}"
    mode: "0600"
